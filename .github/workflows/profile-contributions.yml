name: Refresh profile contributions

on:
  schedule:
    - cron: '24 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'samhoon000/samhoon000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Render public contribution calendar
        run: python3 .github/scripts/render_contributions.py
      - name: Publish changes
        run: |
          if git diff --quiet -- .github/assets/profile/contributions.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/assets/profile/contributions.svg
          git commit -m 'Refresh profile contribution calendar'
          git push
