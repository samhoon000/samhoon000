<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 188" width="856" height="188">
  <title>DataFrame → Oribi → Analytical Context</title>
  <desc>Oribi inspects a pandas DataFrame and returns its grain, column roles, relationships, and warnings.</desc>
  <style>
    .signal { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: signal 4.8s ease-in-out 3; }
      .output { animation-delay: .65s; }
    }
    @keyframes signal {
      0%, 8% { transform: translateX(0); opacity: 0; }
      13%, 29% { opacity: 1; }
      38%, 100% { transform: translateX(104px); opacity: 0; }
    }
  </style>
  <rect width="856" height="188" rx="12" fill="#000"/>
  <rect x=".5" y=".5" width="855" height="187" rx="11.5" fill="none" stroke="#27272A"/>
  <g stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M223 77h117m-8-6 8 6-8 6m183-6h117m-8-6 8 6-8 6" stroke="#51666B"/>
    <g stroke="#A1A1AA">
      <rect x="114" y="51" width="72" height="52" rx="5"/>
      <path d="M114 68h72m-72 17h72m-48-17v35m24-35v35"/>
      <rect x="678" y="47" width="56" height="60" rx="5"/>
      <path d="M692 65h28m-28 12h28m-28 12h18"/>
    </g>
    <rect x="396" y="45" width="64" height="64" rx="11" stroke="#385156" fill="#0A1214"/>
    <path d="M428 56l21 21-21 21-21-21 21-21z" stroke="#A9EAF1"/>
    <circle cx="428" cy="77" r="5" stroke="#A9EAF1"/>
  </g>
  <g fill="#A9EAF1">
    <circle class="signal" cx="226" cy="77" r="4"/>
    <circle class="signal output" cx="518" cy="77" r="4"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif"
     font-size="27" font-weight="600" fill="#F5F5F5">
    <text x="150" y="151">DataFrame</text>
    <text x="428" y="151" fill="#A9EAF1">Oribi</text>
    <text x="706" y="151">Analytical Context</text>
  </g>
</svg>
