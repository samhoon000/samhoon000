<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 244" width="856" height="244">
  <title>Abdul Samhoon</title>
  <desc>A silver nameplate on black, with a fine cyan trace through a geometric line pattern.</desc>
  <style>
    .trace { stroke-dasharray: 54 810; stroke-dashoffset: 54; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { animation: trace 8s cubic-bezier(.3,.15,.3,1) 2; }
    }
    @keyframes trace {
      0%, 18% { stroke-dashoffset: 54; opacity: 0; }
      35% { opacity: .85; }
      72%, 100% { stroke-dashoffset: -752; opacity: 0; }
    }
  </style>
  <rect width="856" height="244" rx="14" fill="#000"/>
  <rect x=".5" y=".5" width="855" height="243" rx="13.5" fill="none" stroke="#27272A"/>
  <g fill="none" stroke-width="1">
    <path d="M0 64h127l34-34h695M0 72h91l23-23h742M0 80h61l14-14h781" stroke="#141719"/>
    <path d="M0 180h856M0 197h781l14-14h61M0 214h742l23-23h91M0 231h695l34-34h127" stroke="#141719"/>
    <path d="M48 181h760" stroke="#303437"/>
    <path d="M48 181h30" stroke="#8BCAD2"/>
    <path class="trace" d="M48 181h760" stroke="#A9EAF1"/>
  </g>
  <text x="428" y="148" fill="#F5F5F5" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="91" font-weight="650" letter-spacing="-5">Abdul Samhoon</text>
</svg>
